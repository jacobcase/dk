name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Track the toolchain the module declares rather than pinning twice.
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go vet ./...

      # -race catches the token store and printer being shared across
      # goroutines; -cover keeps the number visible in the log.
      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # The badge in the README reads from here; without an upload it would
      # sit at "unknown" forever.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Read from the Makefile rather than pinned a second time here. CI ran
      # `latest` while `make lint-full` pinned a version, so a golangci-lint
      # release could fail CI on code that linted clean locally — and the fix
      # would have been to chase a version number nobody had chosen. Same
      # reasoning as go-version-file above.
      - name: Read the golangci-lint version the Makefile pins
        id: golangci
        run: |
          version=$(sed -n 's|^GOLANGCI *:=.*golangci-lint@\(v[0-9][^ ]*\)[[:space:]]*$|\1|p' Makefile)
          if [ -z "$version" ]; then
            echo "no golangci-lint version found in the Makefile's GOLANGCI line"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
